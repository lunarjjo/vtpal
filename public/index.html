<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VTPal — local AI VTuber companion</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%8E%80%3C/text%3E%3C/svg%3E" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three.module.js",
        "@pixiv/three-vrm": "/vendor/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <!-- ======================= stage: the avatar ======================= -->
    <section id="stage">
      <canvas id="avatar-canvas" aria-label="VTuber avatar"></canvas>
      <div id="stage-overlay">
        <div id="vname" class="pill">loading avatar&hellip;</div>
        <div id="expression" class="pill hidden"></div>
      </div>
      <div id="status-bar">
        <span id="st-llm" class="dot dot-pending"></span><span id="st-llm-label">brain: starting</span>
        <span class="sep"></span>
        <span id="st-tts" class="dot dot-pending"></span><span id="st-tts-label">voice: checking</span>
      </div>
    </section>

    <!-- ======================= side panel ======================= -->
    <section id="panel">
      <nav id="tabs">
        <button class="tab active" data-tab="chat">Chat</button>
        <button class="tab" data-tab="memory">Memory</button>
        <button class="tab" data-tab="logs">Logs</button>
      </nav>

      <!-- chat -->
      <div id="tab-chat" class="tab-page active">
        <div id="messages" aria-live="polite"></div>
        <form id="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Say something to your pal&hellip;" maxlength="500" />
          <button id="chat-send" type="submit" title="Send">Send</button>
        </form>
      </div>

      <!-- memory -->
      <div id="tab-memory" class="tab-page">
        <div class="pane-head">
          <h2>Things she remembers</h2>
          <span id="mem-stats" class="muted"></span>
        </div>
        <form id="fact-form">
          <input id="fact-input" type="text" placeholder="Teach a fact: &#34;my cat is Bimo&#34;" maxlength="200" />
          <button type="submit">Remember</button>
        </form>
        <ul id="fact-list"></ul>
        <button id="forget-all" class="danger ghost">Reset all memory</button>
      </div>

      <!-- logs -->
      <div id="tab-logs" class="tab-page">
        <div class="pane-head">
          <h2>Session log</h2>
          <button id="logs-refresh" class="ghost">Refresh</button>
        </div>
        <div id="log-list" class="mono"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
